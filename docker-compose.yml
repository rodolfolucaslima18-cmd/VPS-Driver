services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpsdrive
      POSTGRES_USER: vpsdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpsdrive -d vpsdrive"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VITE_ONLYOFFICE_URL: http://${VPS_HOST}/onlyoffice
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vpsdrive:${POSTGRES_PASSWORD}@db:5432/vpsdrive
      SESSION_SECRET: ${SESSION_SECRET}
      STORAGE_PATH: /data
      PORT: 5000
      NODE_ENV: production
      COOKIE_SECURE: "false"
      BASE_PATH: /
      VPS_HOST: ${VPS_HOST}
      ONLYOFFICE_URL: http://${VPS_HOST}/onlyoffice
      # Diretório de instalação no host — usado pelo botão "Atualizar agora"
      VPS_DRIVE_DIR: /opt/vps-drive-repo
    volumes:
      - storage_data:/data
      - frontend_dist:/frontend
      # Docker-outside-of-Docker: permite que o app dispare docker compose no host
      - /var/run/docker.sock:/var/run/docker.sock
      # Expõe o diretório do repositório para o script de atualização ler o .env e rebuildar
      - /opt/vps-drive-repo:/opt/vps-drive-repo
      # Credenciais git para pull do repositório privado
      - /root/.git-credentials:/root/.git-credentials:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro

  onlyoffice:
    image: onlyoffice/documentserver
    restart: unless-stopped
    environment:
      JWT_ENABLED: "false"
    expose:
      - "80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  postgres_data:
    external: true
    name: vps-drive_postgres_data
  storage_data:
    external: true
    name: vps-drive_storage_data
  frontend_dist:
    external: true
    name: vps-drive_frontend_dist
  onlyoffice_data:
    external: true
    name: vps-drive_onlyoffice_data
  onlyoffice_logs:
    external: true
    name: vps-drive_onlyoffice_logs
